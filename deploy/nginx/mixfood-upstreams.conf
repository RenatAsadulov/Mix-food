# mixfood.in.ua — legacy domain, permanently moved to mixfood-ingredients.com
#
# The upstreams stay here: sites-available/mixfood-ingredients.com references
# them by name. Removing them would take the live site down.
upstream mixfood_api {
  server 127.0.0.1:3012;
  keepalive 32;
}

upstream mixfood_nextjs {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ---- HTTP ----
server {
  listen 80;
  listen [::]:80;
  server_name mixfood.in.ua www.mixfood.in.ua;

  # Must stay reachable, otherwise certificate renewal fails and the
  # redirect below dies with the certificate. Deliberately a location and
  # not a server-level `return`, which would run before location matching
  # and swallow the ACME challenge.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://mixfood-ingredients.com$request_uri;
  }
}

# ---- HTTPS ----
# The certificate has to remain valid: the TLS handshake happens before the
# browser ever sees the redirect.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mixfood.in.ua www.mixfood.in.ua;

  ssl_certificate     /etc/letsencrypt/live/mixfood.in.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mixfood.in.ua/privkey.pem;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://mixfood-ingredients.com$request_uri;
  }
}
