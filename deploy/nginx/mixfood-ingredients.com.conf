# mixfood-ingredients.com - primary domain
# Reuses the mixfood_nextjs / mixfood_api upstreams declared in sites-available/mixfood

# ---- HTTP -> HTTPS ----
server {
  listen 80;
  listen [::]:80;
  server_name mixfood-ingredients.com www.mixfood-ingredients.com;

  return 301 https://mixfood-ingredients.com$request_uri;
}

# ---- www -> apex (canonical host) ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.mixfood-ingredients.com;

  ssl_certificate     /etc/letsencrypt/live/mixfood-ingredients.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mixfood-ingredients.com/privkey.pem;

  return 301 https://mixfood-ingredients.com$request_uri;
}

# ---- HTTPS site ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name mixfood-ingredients.com;

  ssl_certificate     /etc/letsencrypt/live/mixfood-ingredients.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mixfood-ingredients.com/privkey.pem;

  # Contact form API (Next.js)
  location /api/contact {
    proxy_pass http://mixfood_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Other API routes (existing backend)
  location /api {
    proxy_pass http://mixfood_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Vulnerability scanners hammer paths this site has never served: *.php,
  # dotfiles like .env / .env.bak, and editor or deploy configs. Next renders
  # its 404 for each one and caches that render under .next/server/app/, so
  # every probed path left four files behind - 1409 paths, ~108 MB, in the nine
  # days between two deploys. Answering them here keeps them away from Next.
  # The .well-known exception is deliberate: certbot renews with the nginx
  # authenticator today, but a switch back to webroot must not silently break.
  location ~* \.php$ {
    access_log off;
    return 404;
  }

  location ~* ^/(sftp|sftp-config|ftpsync|wp-config)\.json$ {
    access_log off;
    return 404;
  }

  location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
  }

  # Everything else -> Next.js
  location / {
    proxy_pass http://mixfood_nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
